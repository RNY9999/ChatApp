openapi: '3.0.3'

info:
  title: Linknest 管理者 API
  description: |
    ## Linknest 管理者 API仕様書
    - Linknest管理者API一覧を記載。
    - requestとresponseを詳細まで記載。
    ---
    ## サーバに関して
    現在は開発環境しか用意していないためAPIのテストも開発環境でのみ行う。<br>
    今後準本番（stg）や本番（prod）環境を作成次第テスト実施予定。
  version: '1.0.0'

servers:
  - url: http://localhost:5000
    description: 開発環境URL

tags:
  - name: Admin Session
    description: 管理者セッション（ログイン/ログアウト/セッション確認）
  - name: Admin Login Log
    description: 管理者ログインログ
  - name: Server Running Test
    description: サーバ疎通確認用

paths:
  /api/admin/session:
    get:
      tags:
        - Admin Session
      summary: 管理者ログインチェック
      operationId: adminLoginCheck
      description: |
        Cookie `ln_admin_sid` を検証し、セッションの有効性（valid）を返す。
        このエンドポイントでは原則 Set-Cookie を返さない。
      security:
        - CookieAuth: []
      responses:
        '200':
          description: 有効なセッション
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
              examples:
                fullSession:
                  summary: 通常（full）セッション
                  value:
                    valid: true
                    expiresAt: "2025-08-18T06:00:00Z"
                    admin:
                      id: 2
                      email: "linknest@example.com"
                preOtpSession:
                  summary: pre-otpセッション（初回ログイン時・OTP未完了）
                  value:
                    valid: true
                    expiresAt: "2025-08-18T06:00:00Z"
                    admin:
                      id: 3
                      email: "first-login@example.com"
        '401':
          $ref: '#/components/responses/InvalidSession'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Admin Session
      summary: 管理者ログイン
      operationId: adminLogin
      description: |
        認証に成功するとサーバ側でセッションを作成し、`HttpOnly`クッキーとして返却する。<br>
        OTP必須のユーザは202で応答し、OTP入力画面へ誘導する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normal:
                summary: 正常ログイン
                value:
                  email: linknest@example.com
                  password: Asdf1234!
              wrongPassword:
                summary: 認証失敗（パスワード間違い）
                value:
                  email: linknest@example.com
                  password: wrongPassword
      responses:
        '200':
          description: ログイン成功・セッション確立
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminSessionCookie'
            Set-Cookie-CSRF:
              $ref: '#/components/headers/CsrfCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              examples:
                normal:
                  value:
                    nextPath: "/top"
                    admin:
                      id: 2
                      email: "linknest@example.com"
        '202':
          description: |
            OTP認証が必要（初回ログイン時等）<br>
            初回ログイン時のセッションを確立。<br>
            ※初回ログイン完了時はセッションをローテーション（Session Fixation対策）。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminSessionCookie'
            Set-Cookie-CSRF:
              $ref: '#/components/headers/CsrfCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequired'
              examples:
                first_login:
                  value:
                    nextPath: "/login/first/otp/send"
                    otpDeliveryAddress: "linknest@example.com"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/MaxRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/admin/session/refresh:
    post:
      tags:
        - Admin Session
      summary: セッション延長（スライディング）
      security:
        - CookieAuth: []
        - CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: セッション延長（延長が不要でも CSRF は毎回ローテーション）
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AdminSessionCookie' # 必要時のみ新規で発行
            Set-Cookie-CSRF:
              $ref: '#/components/headers/CsrfCookie' # 常に新規で発行
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                  - refreshed
                  - expiresAt
                properties:
                  refreshed:
                    type: boolean
                    example: true
                  expiresAt:
                    type: string
                    format: date-time
                    example: "2025-08-19T10:00:00Z"
        ''

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: ln_admin_sid
      description: HttpOnly クッキーに保持する管理者セッションID
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF対策用のワンタイムパスワード
  schemas:
    SessionStatus:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          example: true
          description: セッションが有効かどうか
        expiresAt:
          type: string
          format: date-time
          example: "2025-08-19T07:33:00Z"
          description: セッション失効予定時刻（返却は任意）
        admin:
          $ref: '#/components/schemas/AdminPublic' # (返却は任意)
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: linknest@example.com
        password:
          type: string
          format: password
          example: Asdf12345!
    LoginSuccess:
      type: object
      required:
        - nextPath
        - admin
      properties:
        nextPath:
          $ref: '#/components/schemas/NextPath'
        admin:
          $ref: '#/components/schemas/AdminPublic'
    OtpRequired:
      type: object
      required:
        - nextPath
        - otpDeliveryAddress
      properties:
        nextPath:
          $ref: '#/components/schemas/NextPath'
        otpDeliveryAddress:
          type: string
          format: email
          example: linknest@example.com
          description: OTP送信先メールアドレス
    AdminPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: linknest@example.com
    NextPath:
      type: string
      example: /top
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: error code
        message:
          type: string
          example: error message
        nextPath:
          $ref: '#/components/schemas/NextPath'
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double Submit Cookie方式。`ln_csrf` の値をヘッダにつける。
      schema:
        type: string
        minLength: 32
        pattern: '^[A-Za-z0-9\-_]{32,}$'   # base64url 等を想定
  headers:
    NoStore:
      description: ブラウザ / プロキシにキャッシュさせない
      schema:
        type: string
        example: no-store
    # 以下Cookieに関するheader
    # Set-Cookie は複数行返る可能性あり（本ヘッダは代表記述）
    AdminSessionCookie:
      description: |
        セッションID Cookie
        ▼example
        `ln_admin_sid={session}; Path=/; HttpOnly; Secure; SameSite=<see note>; Max-Age=1800`
        - HttpOnly: true
        - Secure: true
        - Path: /
        - SameSite: 環境により選択（後述）
      schema:
        type: string
    CsrfCookie:
      description: |
        ダブルサブミット用 CSRF Cookie
        ▼example
        `ln_csrf={token}; Path/; HttpOnly; Secure; SameSite=<see note>; Max-Age=1800`
        - HttpOnly: true
        - Secure: true
        - Path: /
        - SameSite: 環境により選択（後述）
      schema:
        type: string
  responses:
    BadRequest:
      description: バリデーションエラー等不正なリクエスト
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidInput:
              value:
                code: "BAD_REQUEST"
                message: "不正な入力値です。" 
    CsrfMissingHeader:
      description: CSRFヘッダ未送信（400error）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            csrfMissingHeader:
              value:
                code: "CSRF_MISSING_HEADER"
                message: "X-CSRF-Token required"
    CsrfForbidden:
      description: CSRFトークン検証エラー（403共通レスポンス）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            csrfForbidden:
              summary: CSRFトークン検証エラー
              value:
                code: "CSRF_FORBIDDEN"
                message: "CSRFトークンが無効です。"
    InternalServerError:
      description: サーバエラー
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            InternalServerError:
              value:
                code: "INTERNAL_SERVER_ERROR"
                message: "現在、サーバーエラーが発生しています。\nお手数ですが、一定時間経過後に再度ログインをお願いします。"
    InvalidSession:
      description: セッションが無効（未ログイン / 期限切れ / リボーク済み）
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            haveNoSession:
              summary: 無効なセッション
              value:
                code: "UNAUTHORIZED"
                message: "セッションが無効です。"
                nextPath: "/login"
    MaxRequest:
      description: |
        アカウントロック時（本登録・初回登録問わず）<br>
            - 本登録時
            ```
            現在アカウントがロックされています。
            ○○時○○分以降に再度ログインをお試しください。
            ```
            - 初回登録・OTP上限入力後
            ```
            ワンタイムパスワード入力制限に達しました。

            このメールアドレスでのアカウント登録は48時間できません。

            48時間経過後に再度ご登録お願いします。
            ```
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            loginMaxRequest:
              value:
                code: "MAX_REQUEST"
                message: "現在アカウントがロックされています。\n○○時○○分以降に再度ログインをお試しください。"
            firstLoginMaxRequest:
              value:
                code: "MAX_REQUEST"
                message: "ワンタイムパスワード入力制限に達しました。\n\nこのメールアドレスでのアカウント登録は48時間できません。\n\n48時間経過後に再度ご登録お願いします。"
    Unauthorized:
      description: 認証失敗
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: 認証失敗
              value:
                code: "UNAUTHORIZED"
                message: "ID（メールアドレス）またはパスワードが異なります。"
